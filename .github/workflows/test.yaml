name: Test
on:
  push:
    branches:
      - '**'
      - '!dependabot/**'
    tags:
      - '**'
  pull_request:
concurrency:
  group: ${{ github.head_ref || github.sha }}-${{ github.workflow }}
  cancel-in-progress: true
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Install pre-commit
        run: |
          python -m pip install pre-commit
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run pre-commit
        run: |
          pre-commit run --show-diff-on-failure --color=always --all-files
  example-urdf:
    name: Example URDF
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Regenerate example URDFs
        run: |
          docker container run \
            --rm \
            --volume ${PWD}:/source \
            ros:jazzy \
            bash -c '
              set -ex
              apt-get update
              apt-get install -y --no-install-recommends ros-jazzy-xacro
              source /opt/ros/jazzy/setup.bash
              cd /source
              colcon build
              source install/setup.bash
              dev/update-example-urdfs.sh'
      - name: Check example URDFs are up to date
        run: |
          git diff --exit-code -- '*.urdf'
