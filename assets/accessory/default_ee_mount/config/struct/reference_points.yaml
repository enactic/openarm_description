# base_link matches the arm ee_mount_point. The output frame is centred
# on the former motor seat, with +Z pointing out toward the adapter.

adapter_mount_point:
  parent: base_link
  emit: false
  origin:
    x: -0.0205
    y: 0.0
    z: -0.0495
    roll: 3.141592653589793
    pitch: 0.0
    yaw: 0.0
