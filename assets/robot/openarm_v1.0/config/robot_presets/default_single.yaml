robot:
  root_frame: world
  components:
  - arm
  - end_effector
arm:
  type: robot
  enabled: true
  product: openarm_v1.0
  config: arm
  control:
    side: single
    system_name: openarm_hardware_interface
    parameters:
      prefix: ''
  inertials: nominal
  prefix: openarm_
  connection:
    parent: world
    origin:
      x: 0
      y: 0
      z: 0
      roll: 0
      pitch: 0
      yaw: 0
  reflect:
    x: 1
    y: 1
    z: 1
end_effector:
  type: end_effector
  enabled: true
  product: parallel_link
  config: null
  inertials: nominal
  prefix: openarm_
  connection:
    attach_to: arm
    parent_reference_point: ee_mount_point
  reflect:
    x: 1
    y: 1
    z: 1
    include:
      links:
      - link7
      joints: []
      reference_points: []
