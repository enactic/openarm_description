robot:
  root_frame: world
  components:
  - body
  - primary_arm
  - secondary_arm
  - primary_arm_end_effector
  - secondary_arm_end_effector
body:
  type: body
  prefix: openarm_
  enabled: true
  product: v1.0
  config: null
  inertials: nominal
  connection:
    parent: world
    origin:
      x: 0
      y: 0
      z: 0
      roll: 0
      pitch: 0
      yaw: 0
primary_arm:
  type: robot
  enabled: true
  product: openarm_v1.0
  config: arm
  control:
    side: left
  inertials: nominal
  prefix: openarm_left_
  connection:
    attach_to: body
    parent_reference_point: left_arm_mount_point
  reflect:
    x: 1
    y: -1
    z: 1
    include:
      links:
      - link0
      - link1
      - link2
      - link5
      - link6
      - arm_end_link
      joints:
      - joint1
      - joint2
      - joint3
      - joint5
      - joint6
      - joint7
      reference_points:
      - ee_mount_point
  origin_override_joints:
    joint2:
      x: 0.0
      y: 0.0
      z: 0.06
      roll: 1.57079632679
      pitch: 0
      yaw: 0
  limit_override_joints:
    joint2:
      lower: -0.17453267320510335
      upper: 3.3161253267948965
      velocity: 16.754666
      effort: 40
primary_arm_end_effector:
  type: end_effector
  enabled: true
  product: parallel_link
  config: null
  inertials: nominal
  prefix: openarm_left_
  connection:
    attach_to: primary_arm
    parent_reference_point: ee_mount_point
  reflect:
    x: 1
    y: -1
    z: 1
    include:
      links:
      - link7
      joints: []
      reference_points: []
secondary_arm:
  type: robot
  enabled: true
  product: openarm_v1.0
  config: arm
  control:
    side: right
  inertials: nominal
  prefix: openarm_right_
  connection:
    attach_to: body
    parent_reference_point: right_arm_mount_point
  reflect:
    x: 1
    y: 1
    z: 1
  origin_override_joints:
    joint2:
      x: 0.0
      y: 0.0
      z: 0.06
      roll: 1.57079632679
      pitch: 0
      yaw: 0
  limit_override_joints:
    joint2:
      lower: -0.17453267320510335
      upper: 3.3161253267948965
      velocity: 16.754666
      effort: 40
secondary_arm_end_effector:
  type: end_effector
  enabled: true
  product: parallel_link
  config: null
  inertials: nominal
  prefix: openarm_right_
  connection:
    attach_to: secondary_arm
    parent_reference_point: ee_mount_point
  reflect:
    x: 1
    y: 1
    z: 1
    include:
      links:
      - link7
      joints: []
      reference_points: []
