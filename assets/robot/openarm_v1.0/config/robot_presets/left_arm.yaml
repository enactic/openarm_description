robot:
  root_frame: world
  components:
  - arm
arm:
  type: robot
  enabled: true
  product: openarm_v1.0
  config: arm
  control:
    side: left
  inertials: nominal
  prefix: openarm_left_
  connection:
    parent: world
    origin:
      x: 0
      y: 0
      z: 0
      roll: 0
      pitch: 0
      yaw: 0
  reflect:
    x: 1
    y: -1
    z: 1
    include:
      links:
      - link0
      - link1
      - link2
      - link5
      - link6
      - arm_end_link
      joints:
      - joint1
      - joint2
      - joint3
      - joint5
      - joint6
      - joint7
      reference_points:
      - ee_mount_point
