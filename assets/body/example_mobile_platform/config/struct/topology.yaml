# Example platform: four steerable wheel modules and one telescoping lift.
links:
  base_link: {}
  link1:
    name: front_left_steer_link
  link2:
    name: front_left_wheel_link
  link3:
    name: front_right_steer_link
  link4:
    name: front_right_wheel_link
  link5:
    name: rear_left_steer_link
  link6:
    name: rear_left_wheel_link
  link7:
    name: rear_right_steer_link
  link8:
    name: rear_right_wheel_link
  link9:
    name: lift_column_link
joints:
  joint1:
    name: front_left_steer_joint
    type: revolute
    parent: base_link
    child: link1
  joint2:
    name: front_left_wheel_joint
    type: continuous
    parent: link1
    child: link2
  joint3:
    name: front_right_steer_joint
    type: revolute
    parent: base_link
    child: link3
  joint4:
    name: front_right_wheel_joint
    type: continuous
    parent: link3
    child: link4
  joint5:
    name: rear_left_steer_joint
    type: revolute
    parent: base_link
    child: link5
  joint6:
    name: rear_left_wheel_joint
    type: continuous
    parent: link5
    child: link6
  joint7:
    name: rear_right_steer_joint
    type: revolute
    parent: base_link
    child: link7
  joint8:
    name: rear_right_wheel_joint
    type: continuous
    parent: link7
    child: link8
  joint9:
    name: lift_joint
    type: prismatic
    parent: base_link
    child: link9
