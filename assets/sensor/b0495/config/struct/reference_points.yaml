# Optical center: CAD camera_center + 16 mm along the lens axis (base_link +Z).
# Optical axes: image right/down/forward; keep roll independent of mesh reflection.
camera_center:
  parent: base_link
  emit: false
  origin:
    x: 0.0
    y: 0.0
    z: 0.021153506075352935
    roll: 0.0
    pitch: 0.0
    yaw: 0.0
camera_optical_frame:
  parent: base_link
  emit: true
  origin:
    x: 0.0
    y: 0.0
    z: 0.037153506075352935
    roll: 0.0
    pitch: 0.0
    yaw: 1.5707963267948966
