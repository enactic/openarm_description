# Four steerable wheel modules, a 0.30 m lift, and standard V2 arms/grippers.
# The root is base_footprint; the systems below are for mock/preview use.
robot:
  name: openarm_mobile_example
  root_frame: base_footprint
  components:
  - body
  - primary_arm
  - secondary_arm
  - primary_arm_end_effector
  - primary_arm_end_effector_camera
  - secondary_arm_end_effector
  - secondary_arm_end_effector_camera
body:
  type: body
  product: example_mobile_platform
  config: null
  inertials: nominal
  prefix: openarm_mobile_
  enabled: true
  connection:
    parent: base_footprint
    origin:
      x: 0.0
      y: 0.0
      z: 0.0
      roll: 0.0
      pitch: 0.0
      yaw: 0.0
primary_arm:
  type: arm
  enabled: true
  product: openarm_v2.0
  config: null
  inertials: nominal
  prefix: openarm_left_
  connection:
    attach_to: body
    parent_reference_point: left_arm_mount_point
    parent: null
    origin: null
  reflect:
    x: 1
    y: -1
    z: 1
    include:
      links:
      - base_link
      - link1
      - link2
      - link5
      - link6
      - link7
      joints:
      - joint1
      - joint2
      - joint3
      - joint5
      - joint6
      - joint7
      reference_points:
      - ee_mount_point
  limit_override_joints: {}
secondary_arm:
  type: arm
  enabled: true
  product: openarm_v2.0
  config: null
  inertials: nominal
  prefix: openarm_right_
  connection:
    attach_to: body
    parent_reference_point: right_arm_mount_point
    parent: null
    origin: null
  reflect:
    x: 1
    y: 1
    z: 1
  limit_override_joints: {}
primary_arm_end_effector:
  type: end_effector
  enabled: true
  product: pinch_gripper
  config: null
  inertials: nominal
  prefix: openarm_left_
  connection:
    attach_to: primary_arm
    parent_reference_point: ee_mount_point
    parent: null
    origin: {x: 0, y: 0, z: 0, roll: 0, pitch: 1.5707963267948966, yaw: 0}
  reflect:
    x: 1
    y: -1
    z: 1
  limit_override_joints: {}
primary_arm_end_effector_camera:
  type: sensor
  enabled: true
  product: b0495
  config: null
  inertials: nominal
  prefix: openarm_left_
  connection:
    attach_to: primary_arm_end_effector
    parent_reference_point: camera_mount_point
secondary_arm_end_effector:
  type: end_effector
  enabled: true
  product: pinch_gripper
  config: null
  inertials: nominal
  prefix: openarm_right_
  connection:
    attach_to: secondary_arm
    parent_reference_point: ee_mount_point
    parent: null
    origin: {x: 0, y: 0, z: 0, roll: 0, pitch: 1.5707963267948966, yaw: 0}
  reflect:
    x: 1
    y: 1
    z: 1
  limit_override_joints: {}
secondary_arm_end_effector_camera:
  type: sensor
  enabled: true
  product: b0495
  config: null
  inertials: nominal
  prefix: openarm_right_
  connection:
    attach_to: secondary_arm_end_effector
    parent_reference_point: camera_mount_point
systems:
  example_mobile_robot:
    hardware_plugin: mock_components/GenericSystem
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    components:
      body:
        joints: [joint1, joint2, joint3, joint4, joint5, joint6, joint7, joint8, joint9]
        idx: [0, 1, 2, 3, 4, 5, 6, 7, 8]
        offset: default
        init_pos: default
      primary_arm:
        joints: [joint1, joint2, joint3, joint4, joint5, joint6, joint7]
        idx: [9, 10, 11, 12, 13, 14, 15]
        control_gains: default
        offset: default
        init_pos: folded
      secondary_arm:
        joints: [joint1, joint2, joint3, joint4, joint5, joint6, joint7]
        idx: [16, 17, 18, 19, 20, 21, 22]
        control_gains: default
        offset: default
        init_pos: folded
      primary_arm_end_effector:
        joints: [joint1]
        idx: [23]
        control_gains: default
        offset: default
        init_pos: default
      secondary_arm_end_effector:
        joints: [joint1]
        idx: [24]
        control_gains: default
        offset: default
        init_pos: default
preview:
  view:
    eye:
      x: 2.2
      y: -2.6
      z: 1.8
    lookat:
      x: 0.1
      y: 0.0
      z: 0.65
